<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<script>
// puter.js 를 startTranscribe 시점에 직접 로드하고, 로드가 끝난 뒤에만 speech2txt 를 부른다.
// (예전엔 onPageFinished=준비완료로 봤는데, 그건 외부 스크립트 로드 완료를 보장하지 않아
//  puter 가 undefined 인 채 호출돼 "puter is not defined" 가 났다.)
function ensurePuter(cb) {
  if (window.puter) { cb(true); return; }
  var s = document.createElement('script');
  s.src = 'https://js.puter.com/v2/';
  s.onload = function () { cb(!!window.puter); };
  s.onerror = function () { cb(false); };
  document.head.appendChild(s);
}

function startTranscribe() {
  ensurePuter(function (ok) {
    if (!ok || typeof puter === 'undefined') {
      Android.onError('puter 로드 실패 — 네트워크/차단 확인');
      return;
    }
    try {
      var dataUrl = Android.getAudioDataUrl();
      if (!dataUrl) { Android.onError('녹음 데이터가 없습니다'); return; }
      puter.ai.speech2txt(dataUrl)
        .then(function (r) {
          var text = (r && typeof r.text === 'string') ? r.text : ('' + r);
          Android.onResult(text);
        })
        .catch(function (e) {
          Android.onError('' + (e && e.message ? e.message : e));
        });
    } catch (e) {
      Android.onError('' + e);
    }
  });
}
</script>
</body>
</html>
