name: build-release

# 수동 실행(workflow_dispatch) 또는 vX.Y 태그 푸시 시:
# APK 빌드 → GitHub Release 생성/갱신 + APK 업로드.
# 차량 앱은 시작 시 releases/latest 를 확인해 새 버전을 자동 설치한다(OTA).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Read version
        id: v
        run: echo "version=$(sed -n 's/.*versionName = \"\(.*\)\"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "byd-karaoke-v${{ steps.v.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: byd-karaoke-v${{ steps.v.outputs.version }}
          path: byd-karaoke-v*.apk

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "v$V" "byd-karaoke-v$V.apk" \
            --title "v$V" --notes "자동 빌드 (${{ github.sha }})" --target "${{ github.sha }}" \
          || gh release upload "v$V" "byd-karaoke-v$V.apk" --clobber
